# Demo: Delta Dore X3D lock detectors (K-LINE DVI) of windows and doors
# ("ouvrants") -> Home Assistant.
# ESP32 DevKit V1 + RFM69HW 868 MHz, wiring in esphome/README.md.
#
# Each window or door is one package include: pick the profile matching the
# opening, give it an id, a name and its radio ID(s) from the logs.
# The DVI reads the handle: locked / unlocked, and the tilt position on tilt
# windows. Opening the sash doesn't send anything.

esphome:
  name: x3d-dvi
  friendly_name: X3D openings

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://netixx/x3d-rfm-esp32@esphome-x3d-dvi
    components: [x3d_rfm69]

logger:
  level: DEBUG
  # DEBUG: one decoded line per X3D frame. VERBOSE adds the raw bytes of
  # every packet received.

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {} # reuses the api encryption key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

x3d_rfm69:
  cs_pin: GPIO5
  dio0_pin: GPIO4
  # Discovery: what devices without entities send is logged at INFO, with
  # their ID. Devices with entities (claimed) log at DEBUG.
  log_unclaimed_devices: true
  # Publish the last saved handle position at boot (entities not "unknown").
  restore_state: true

# One include per window or door. Profiles: window, door, sliding_door,
# tilt_window, double_window, double_sliding_door (esphome/profiles/).
# Optional vars: rssi: true, state: true.
packages:
  bathroom_window:
    url: https://github.com/netixx/x3d-rfm-esp32
    ref: esphome-x3d-dvi
    files:
      - path: esphome/profiles/tilt_window.yaml
        vars:
          id: bathroom_window
          name: "Bathroom window"
          x3d_id: "0xEFCC85"
  living_room_door:
    url: https://github.com/netixx/x3d-rfm-esp32
    ref: esphome-x3d-dvi
    files:
      - path: esphome/profiles/double_sliding_door.yaml
        vars:
          id: living_room_door
          name: "Living room door"
          left_x3d_id: "0xEFA00B"
          right_x3d_id: "0xEFACF4"
          rssi: true

# Customize any generated entity by its id with ESPHome's !extend.
binary_sensor:
  - id: !extend bathroom_window_lock
    icon: mdi:window-closed-variant

text_sensor:
  # Last frame of any device: turn each handle and read its ID here or in the logs.
  - platform: x3d_rfm69
    type: last_frame
    name: "Last X3D frame"
