# Demo: Delta Dore X3D lock detectors (K-LINE DVI) of windows and doors
# ("ouvrants") -> Home Assistant.
# ESP32 DevKit V1 + RFM69HW 868 MHz, wiring in esphome/README.md.
#
# Two ways to get openings into Home Assistant, both enabled below:
#  A. Map IDs in Home Assistant: every event of every device is sent as an
#     "esphome.x3d_opening" HA event. See homeassistant/x3d_openings.yaml.
#     Adding an opening needs no reflash.
#  B. Map IDs here: list each opening under "openings:" with its device_id
#     and name, ESPHome creates native entities.
#
# The DVI reads the handle: locked / unlocked, and the tilt position on tilt
# windows. Opening the sash doesn't send anything.

esphome:
  name: x3d-dvi
  friendly_name: X3D openings

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://netixx/x3d-rfm-esp32@esphome-x3d-dvi
    components: [x3d_rfm69]

logger:
  level: DEBUG
  # DEBUG: one decoded line per X3D frame. VERBOSE adds the raw bytes of
  # every packet received.

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {} # reuses the api encryption key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

x3d_rfm69:
  id: x3d_radio
  cs_pin: GPIO5
  dio0_pin: GPIO4
  frequency: 868.95MHz
  # Discovery: log what devices not listed under "openings:" send at INFO,
  # with their ID. Listed (claimed) devices log at DEBUG.
  log_unclaimed_devices: true
  # Publish the last saved handle position at boot (entities not "unknown").
  restore_state: true
  # Last event of any device: turn each handle and read its ID here or in the logs.
  last_frame:
    name: "Last X3D frame"
  # Option B: one entry per window or door, device_id taken from the logs /
  # "Last X3D frame". Creates the binary sensor "<name> lock" (shown as
  # Locked / Unlocked). Optional, with "true":
  #   tilt:  binary sensor "<name> tilted", for tilt windows
  #   state: text sensor, locked / unlocked
  #   rssi:  signal strength, dBm
  # Each key also takes entity options (icon, internal, ...); "lock: false" disables it.
  openings:
    - device_id: 0xEFCC85
      name: "Tilt window"
      tilt: true
    - device_id: 0xEFA00B
      name: "Sliding door"
      rssi: true
  # Option A: forward every event to Home Assistant, once per real event
  # (radio repeats are dropped). Variables: device_id ("EFCC85"),
  # state (locked / unlocked / unchanged), tilted (bool),
  # kind (window / sliding / other), rssi (dBm), raw (hex).
  on_opening_event:
    - homeassistant.event:
        event: esphome.x3d_opening
        data:
          device_id: !lambda "return device_id;"
          state: !lambda "return state;"
          tilted: !lambda 'return tilted ? "true" : "false";'
          kind: !lambda "return kind;"
          rssi: !lambda "return str_sprintf(\"%.1f\", rssi);"
