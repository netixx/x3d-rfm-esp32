# Sliding door or window with two sliding sashes, one DVI per sash.
# Creates an HA device "${name}" with "Left lock", "Right lock" and a combined
# "Lock": unlocked as soon as one sash is, locked when both are, else unknown.
# Entity ids: ${id}_left_lock, ${id}_right_lock, ${id}_lock,
# ${id}_left_rssi, ${id}_right_rssi, ${id}_left_state, ${id}_right_state,
# ${id}_left_handle, ${id}_right_handle, ${id}_left_connectivity,
# ${id}_right_connectivity.
#
# vars:
#   id:           unique id, used for the HA device and the entity ids
#   name:         device name in Home Assistant
#   left_x3d_id:  radio ID of the left sash ("0xEFA00B")
#   right_x3d_id: radio ID of the right sash
#   rssi:         true to add "Left RSSI" / "Right RSSI" (default false)
#   state:        true to add "Left state" / "Right state" (default false)
#   lock_entity:  true to add read-only "Left handle" / "Right handle" lock
#                 entities (default false), see the README: workaround so the
#                 sashes show in the Security section of HA's area dashboard
#   connectivity: true to add "Left connectivity" / "Right connectivity"
#                 (default false), OFF when a sash sent nothing for the hub
#                 `timeout` (battery dead?)
#
# Optional entities are always listed and switched with "enabled", so the
# profile works without conditional includes (older ESPHome releases).
substitutions:
  rssi: "false"
  state: "false"
  lock_entity: "false"
  connectivity: "false"

esphome:
  devices:
    - id: ${id}
      name: ${name}

binary_sensor:
  - platform: x3d_rfm69
    id: ${id}_left_lock
    x3d_id: ${left_x3d_id}
    type: lock
    name: "Left lock"
    device_id: ${id}
  - platform: x3d_rfm69
    id: ${id}_right_lock
    x3d_id: ${right_x3d_id}
    type: lock
    name: "Right lock"
    device_id: ${id}
  - platform: x3d_rfm69
    id: ${id}_left_connectivity
    x3d_id: ${left_x3d_id}
    type: connectivity
    name: "Left connectivity"
    device_id: ${id}
    enabled: ${connectivity}
  - platform: x3d_rfm69
    id: ${id}_right_connectivity
    x3d_id: ${right_x3d_id}
    type: connectivity
    name: "Right connectivity"
    device_id: ${id}
    enabled: ${connectivity}
  - platform: template
    id: ${id}_lock
    name: Lock
    device_id: ${id}
    device_class: lock  # ON = unlocked
    lambda: |-
      // Unlocked as soon as one sash is, locked when both are, else unknown.
      if (id(${id}_left_lock).state || id(${id}_right_lock).state)
        return true;
      if (id(${id}_left_lock).has_state() && id(${id}_right_lock).has_state())
        return false;
      return {};

sensor:
  - platform: x3d_rfm69
    id: ${id}_left_rssi
    x3d_id: ${left_x3d_id}
    name: "Left RSSI"
    device_id: ${id}
    enabled: ${rssi}
  - platform: x3d_rfm69
    id: ${id}_right_rssi
    x3d_id: ${right_x3d_id}
    name: "Right RSSI"
    device_id: ${id}
    enabled: ${rssi}

text_sensor:
  - platform: x3d_rfm69
    id: ${id}_left_state
    x3d_id: ${left_x3d_id}
    type: state
    name: "Left state"
    device_id: ${id}
    enabled: ${state}
  - platform: x3d_rfm69
    id: ${id}_right_state
    x3d_id: ${right_x3d_id}
    type: state
    name: "Right state"
    device_id: ${id}
    enabled: ${state}

# Read-only lock entities, off by default (lock_entity: true). Workaround:
# HA's area dashboard only lists lock entities in its Security section.
lock:
  - platform: x3d_rfm69
    id: ${id}_left_handle
    x3d_id: ${left_x3d_id}
    name: "Left handle"
    device_id: ${id}
    enabled: ${lock_entity}
  - platform: x3d_rfm69
    id: ${id}_right_handle
    x3d_id: ${right_x3d_id}
    name: "Right handle"
    device_id: ${id}
    enabled: ${lock_entity}
