# Window with two sashes ("deux vantaux"), one DVI per sash.
# Creates an HA device "${name}" with a combined "Lock" (unlocked as soon as
# one sash is, locked when both are, else unknown) and, as diagnostic
# entities (device page only, not in HA's Security views), "Left lock" /
# "Right lock" for each sash.
# Entity ids: ${id}_lock, ${id}_left_lock, ${id}_right_lock,
# ${id}_left_rssi, ${id}_right_rssi, ${id}_left_state, ${id}_right_state,
# ${id}_left_connectivity, ${id}_right_connectivity, ${id}_left_battery,
# ${id}_right_battery, ${id}_handle.
#
# vars:
#   id:            unique id, used for the HA device and the entity ids
#   name:          device name in Home Assistant
#   left_x3d_id:   radio ID of the left sash ("0xEFA00B")
#   right_x3d_id:  radio ID of the right sash
#   rssi:          true to add "Left RSSI" / "Right RSSI" (default false)
#   state:         true to add "Left state" / "Right state" (default false)
#   connectivity:  true to add "Left connectivity" / "Right connectivity"
#                  (default false), OFF when a sash sent nothing for the hub
#                  `timeout` (battery dead?)
#   battery:       true to add "Left battery" / "Right battery" (default
#                  false): low when the suspected low battery flag is set, or
#                  when the sash sent nothing for the hub `timeout`
#   lock_entity:   true to add a read-only "Handle" lock entity with the
#                  combined state (default false), see the README: workaround
#                  so the opening shows in the Security section of HA's area
#                  dashboard
#
# Optional entities are always listed and switched with "enabled", so the
# profile works without conditional includes (older ESPHome releases).
substitutions:
  rssi: "false"
  state: "false"
  lock_entity: "false"
  connectivity: "false"
  battery: "false"

esphome:
  devices:
    - id: ${id}
      name: ${name}

binary_sensor:
  - platform: x3d_rfm69
    id: ${id}_lock
    x3d_id:
      - ${left_x3d_id}
      - ${right_x3d_id}
    type: lock
    name: "Lock"
    device_id: ${id}
    # Only one entity per opening in HA's Security views: this one, or the
    # Handle lock when lock_entity is true.
    entity_category: "${ 'diagnostic' if (lock_entity | string | lower) == 'true' else '' }"
  - platform: x3d_rfm69
    id: ${id}_left_lock
    x3d_id: ${left_x3d_id}
    type: lock
    name: "Left lock"
    device_id: ${id}
    entity_category: diagnostic  # device page only, not in Security views
  - platform: x3d_rfm69
    id: ${id}_right_lock
    x3d_id: ${right_x3d_id}
    type: lock
    name: "Right lock"
    device_id: ${id}
    entity_category: diagnostic  # device page only, not in Security views
  - platform: x3d_rfm69
    id: ${id}_left_connectivity
    x3d_id: ${left_x3d_id}
    type: connectivity
    name: "Left connectivity"
    device_id: ${id}
    enabled: ${connectivity}
  - platform: x3d_rfm69
    id: ${id}_right_connectivity
    x3d_id: ${right_x3d_id}
    type: connectivity
    name: "Right connectivity"
    device_id: ${id}
    enabled: ${connectivity}
  - platform: x3d_rfm69
    id: ${id}_left_battery
    x3d_id: ${left_x3d_id}
    type: battery
    name: "Left battery"
    device_id: ${id}
    enabled: ${battery}
  - platform: x3d_rfm69
    id: ${id}_right_battery
    x3d_id: ${right_x3d_id}
    type: battery
    name: "Right battery"
    device_id: ${id}
    enabled: ${battery}

sensor:
  - platform: x3d_rfm69
    id: ${id}_left_rssi
    x3d_id: ${left_x3d_id}
    name: "Left RSSI"
    device_id: ${id}
    enabled: ${rssi}
  - platform: x3d_rfm69
    id: ${id}_right_rssi
    x3d_id: ${right_x3d_id}
    name: "Right RSSI"
    device_id: ${id}
    enabled: ${rssi}

text_sensor:
  - platform: x3d_rfm69
    id: ${id}_left_state
    x3d_id: ${left_x3d_id}
    type: state
    name: "Left state"
    device_id: ${id}
    entity_category: diagnostic
    enabled: ${state}
  - platform: x3d_rfm69
    id: ${id}_right_state
    x3d_id: ${right_x3d_id}
    type: state
    name: "Right state"
    device_id: ${id}
    entity_category: diagnostic
    enabled: ${state}

# Read-only lock entity with the combined state, off by default
# (lock_entity: true). Workaround: HA's area dashboard only lists lock
# entities in its Security section.
lock:
  - platform: x3d_rfm69
    id: ${id}_handle
    x3d_id:
      - ${left_x3d_id}
      - ${right_x3d_id}
    name: "Handle"
    device_id: ${id}
    enabled: ${lock_entity}
