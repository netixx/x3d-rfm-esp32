# Sliding door or window with one sliding sash and one DVI.
# Creates an HA device "${name}" with "Lock" ("Lock" is shown as
# Locked / Unlocked). Entity ids: ${id}_lock, ${id}_rssi, ${id}_state.
#
# vars:
#   id:     unique id, used for the HA device and the entity ids
#   name:   device name in Home Assistant
#   x3d_id: radio ID, as printed in the logs ("0xEFCC85")
#   rssi:   true to add an "RSSI" sensor (default false)
#   state:  true to add a "State" text sensor, locked / unlocked (default false)
#
# Optional entities are always listed and switched with "enabled", so the
# profile works without conditional includes (older ESPHome releases).
substitutions:
  rssi: "false"
  state: "false"

esphome:
  devices:
    - id: ${id}
      name: ${name}

binary_sensor:
  - platform: x3d_rfm69
    id: ${id}_lock
    x3d_id: ${x3d_id}
    type: lock
    name: "Lock"
    device_id: ${id}

sensor:
  - platform: x3d_rfm69
    id: ${id}_rssi
    x3d_id: ${x3d_id}
    name: "RSSI"
    device_id: ${id}
    enabled: ${rssi}

text_sensor:
  - platform: x3d_rfm69
    id: ${id}_state
    x3d_id: ${x3d_id}
    type: state
    name: "State"
    device_id: ${id}
    enabled: ${state}
