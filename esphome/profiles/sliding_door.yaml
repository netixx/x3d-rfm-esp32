# Sliding door or window with one sliding sash and one DVI.
# Creates an HA device "${name}" with "Lock" ("Lock" is shown as
# Locked / Unlocked).
# Entity ids: ${id}_lock, ${id}_rssi, ${id}_state, ${id}_lock_entity,
# ${id}_connectivity,
# ${id}_battery.
#
# vars:
#   id:     unique id, used for the HA device and the entity ids
#   name:   device name in Home Assistant
#   x3d_id: radio ID, as printed in the logs ("0xEFCC85")
#   rssi:   true to add an "RSSI" sensor (default false)
#   state:  true to add a "State" text sensor, locked / unlocked (default false)
#   lock_entity: true to add a read-only "Lock" lock entity (default false),
#           see the README: workaround so the opening shows in the Security
#           section of HA's area dashboard
#   battery: true to add a "Battery" sensor (default false): low when the
#           suspected low battery flag is set, or when the DVI sent nothing
#           for the hub `timeout`
#   connectivity: true to add a "Connectivity" sensor (default false), OFF
#           when the DVI sent nothing for the hub `timeout` (battery dead?)
#
# Optional entities are always listed and switched with "enabled", so the
# profile works without conditional includes (older ESPHome releases).
substitutions:
  rssi: "false"
  state: "false"
  lock_entity: "false"
  connectivity: "false"
  battery: "false"

esphome:
  devices:
    - id: ${id}
      name: ${name}

binary_sensor:
  - platform: x3d_rfm69
    id: ${id}_lock
    x3d_id: ${x3d_id}
    type: lock
    name: "Lock"
    device_id: ${id}
    # Only one entity per opening in HA's Security views: this one, or the
    # lock entity when lock_entity is true.
    entity_category: "${ 'diagnostic' if (lock_entity | string | lower) == 'true' else '' }"
  - platform: x3d_rfm69
    id: ${id}_connectivity
    x3d_id: ${x3d_id}
    type: connectivity
    name: "Connectivity"
    device_id: ${id}
    enabled: ${connectivity}
  - platform: x3d_rfm69
    id: ${id}_battery
    x3d_id: ${x3d_id}
    type: battery
    name: "Battery"
    device_id: ${id}
    enabled: ${battery}

sensor:
  - platform: x3d_rfm69
    id: ${id}_rssi
    x3d_id: ${x3d_id}
    name: "RSSI"
    device_id: ${id}
    enabled: ${rssi}

text_sensor:
  - platform: x3d_rfm69
    id: ${id}_state
    x3d_id: ${x3d_id}
    type: state
    name: "State"
    device_id: ${id}
    enabled: ${state}

# Read-only lock entity, off by default (lock_entity: true). Workaround:
# HA's area dashboard only lists lock entities in its Security section.
lock:
  - platform: x3d_rfm69
    id: ${id}_lock_entity
    x3d_id: ${x3d_id}
    name: "Lock"
    device_id: ${id}
    enabled: ${lock_entity}
