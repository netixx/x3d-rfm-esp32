# Home Assistant config: map X3D device IDs to entities (option A).
#
# Either paste the "template:" block below into configuration.yaml, or use it as
# a package: put this file in <config>/packages/ and add to configuration.yaml
#   homeassistant:
#     packages: !include_dir_named packages
#
# Find IDs with the "Last X3D frame" entity, the ESPHome logs, or
# Developer tools > Events > listen to "esphome.x3d_window", then copy one
# block per window and change the ID / names. Restart or reload template entities.
#
# The DVI reads the handle: states are "locked" / "unlocked".
# Trigger-based template entities keep their last state across HA restarts.

template:
  - triggers:
      - trigger: event
        event_type: esphome.x3d_window
        event_data:
          device_id: "EFCC85"
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.state != 'unchanged' }}"
    binary_sensor:
      - name: "Tilt window lock"
        unique_id: x3d_efcc85_lock
        device_class: lock # on = unlocked
        state: "{{ trigger.event.data.state == 'unlocked' }}"
        attributes:
          rssi: "{{ trigger.event.data.rssi }}"

  - triggers:
      - trigger: event
        event_type: esphome.x3d_window
        event_data:
          device_id: "EFA00B"
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.state != 'unchanged' }}"
    binary_sensor:
      - name: "Sliding door lock"
        unique_id: x3d_efa00b_lock
        device_class: lock
        state: "{{ trigger.event.data.state == 'unlocked' }}"
        attributes:
          rssi: "{{ trigger.event.data.rssi }}"
