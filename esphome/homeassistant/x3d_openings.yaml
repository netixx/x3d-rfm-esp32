# Home Assistant config: map X3D device IDs to entities (option A).
#
# Either paste the "template:" block below into configuration.yaml, or use it as
# a package: put this file in <config>/packages/ and add to configuration.yaml
#   homeassistant:
#     packages: !include_dir_named packages
#
# Find IDs with the "Last X3D frame" entity, the ESPHome logs, or
# Developer tools > Events > listen to "esphome.x3d_opening", then copy one
# block per window or door and change the ID / names. Restart or reload
# template entities.
#
# Event data: device_id, state (locked / unlocked / unchanged),
# tilted ("true" / "false"), kind (window / sliding / other), rssi.
# Trigger-based template entities keep their last state across HA restarts.

template:
  - triggers:
      - trigger: event
        event_type: esphome.x3d_opening
        event_data:
          device_id: "EFCC85"
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.state != 'unchanged' }}"
    binary_sensor:
      - name: "Tilt window lock"
        unique_id: x3d_efcc85_lock
        device_class: lock # shown as Locked / Unlocked
        state: "{{ trigger.event.data.state == 'unlocked' }}"
        attributes:
          rssi: "{{ trigger.event.data.rssi }}"
      # Tilt windows only
      - name: "Tilt window tilted"
        unique_id: x3d_efcc85_tilted
        icon: mdi:window-open-variant
        state: "{{ trigger.event.data.tilted == 'true' }}"

  - triggers:
      - trigger: event
        event_type: esphome.x3d_opening
        event_data:
          device_id: "EFA00B"
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.state != 'unchanged' }}"
    binary_sensor:
      - name: "Sliding door lock"
        unique_id: x3d_efa00b_lock
        device_class: lock
        state: "{{ trigger.event.data.state == 'unlocked' }}"
        attributes:
          rssi: "{{ trigger.event.data.rssi }}"
